<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AnyRoadmap — Transforme dados em direção</title>
  <desc id="desc">Uma trilha neon conecta etapas de uma jornada de aprendizado em dados.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0a0d"/><stop offset="1" stop-color="#18131a"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff5ba7"/><stop offset="1" stop-color="#8de8e4"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ff5ba7" stop-opacity=".22"/><stop offset="1" stop-color="#ff5ba7" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="210" r="250" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M690 305C780 280 760 128 860 138s85 143 174 114 64-141 148-160" stroke="#ff5ba7" stroke-opacity=".12" stroke-width="58"/>
    <path d="M690 305C780 280 760 128 860 138s85 143 174 114 64-141 148-160" stroke="url(#line)" stroke-width="3"/>
  </g>
  <g fill="#151317" stroke-width="3">
    <circle cx="706" cy="297" r="13" stroke="#ff5ba7"/><circle cx="850" cy="138" r="13" stroke="#ff78b8"/>
    <circle cx="1018" cy="255" r="13" stroke="#c59dc7"/><circle cx="1162" cy="102" r="13" stroke="#8de8e4"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="74" y="104" fill="#ff5ba7" font-size="15" font-weight="700" letter-spacing="4">JORNADA EM DADOS</text>
    <text x="70" y="185" fill="#f7f3f6" font-size="62" font-weight="700" letter-spacing="-3">Any<tspan fill="#ff5ba7">Roadmap</tspan></text>
    <text x="74" y="236" fill="#aaa3a8" font-size="23">Transforme dados em direção.</text>
    <text x="74" y="316" fill="#8de8e4" font-size="15" font-weight="700">21 ETAPAS</text>
    <text x="208" y="316" fill="#8de8e4" font-size="15" font-weight="700">18 MESES</text>
    <text x="337" y="316" fill="#8de8e4" font-size="15" font-weight="700">1 JORNADA</text>
  </g>
</svg>
