name: Publicar AnyRoadmap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verificar sintaxe
        run: npm run check

      - name: Executar testes
        run: npm test

      - name: Gerar versão de produção
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos de publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
